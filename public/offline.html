<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254c38" />
    <title>Offline · My Reading Room</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f0; color: #263d31; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 340px; padding: 24px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font: 600 28px/1.2 Georgia, serif; margin: 14px 0 8px; }
      p { color: #627766; margin: 0 0 18px; }
      a { display: inline-block; background: #2d5941; color: #fff; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Your reading room needs a connection to load your books and sessions. Nothing is stored on this device.</p>
      <a href="/insights">Try again</a>
    </main>
  </body>
</html>
