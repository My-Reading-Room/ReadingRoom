name: Feature request
description: An idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem it solves and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and privacy
      description: Does it store new data or show data to friends? Who should be able to see it?
