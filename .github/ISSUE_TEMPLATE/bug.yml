name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please don't file it here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …"
  - type: input
    id: where
    attributes:
      label: Where
      description: Page, browser and device (e.g. Insights, Safari on iPhone)
