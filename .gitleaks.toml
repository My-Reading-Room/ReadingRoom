# Secret scanning (gitleaks), run in CI on every PR (#14).
[extend]
useDefault = true

# Supabase *publishable* keys are public by design: the site sends them to
# every browser and row-level security protects the data. Only that prefix is
# allowed here; secret keys (sb_secret_…), service_role JWTs and any other API
# key still fail the scan.
[[allowlists]]
description = "Supabase publishable keys (public, browser-safe)"
regexTarget = "match"
regexes = ['''sb_publishable_[A-Za-z0-9_-]{20,}''']

# The default rules don't know Supabase's new secret-key format.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret (server-only) API key"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
