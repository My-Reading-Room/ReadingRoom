/* v1.3: book-specific reading-day cards and optional stopwatch */
.bookdays-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}
.bookdays-row{display:grid;grid-template-columns:minmax(105px,1.9fr) minmax(55px,.8fr) minmax(55px,.85fr) minmax(65px,1fr);align-items:center;gap:9px;border-top:1px solid #e9efe7;padding:11px 3px;font-size:11px}
.bookdays-row.titles{background:#f1f6ef;border-top:0;padding:10px 5px;color:#69816f;font-size:9px;font-weight:800;border-radius:6px}
.bookdays-name{font-weight:750;text-align:left;border:0;background:transparent;padding:0;color:#325d40;font-size:11px;cursor:pointer}
.bookdays-name:hover{text-decoration:underline}
.bookdays-value{font-weight:750;font-variant-numeric:tabular-nums}.bookdays-mini{height:5px;background:#e9f1e7;border-radius:6px;margin-top:5px;overflow:hidden}.bookdays-mini i{display:block;height:100%;background:#5a996f;border-radius:6px}
.daytiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:14px 0}
.daytile{border-radius:7px;background:#eff1eb;padding:13px 2px;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:8px;color:#839187;font-size:10px;font-weight:650}
.daytile.active{background:#dbecdf;color:#2b6542}.daydot{height:11px;width:11px;background:#d9dfd6;border-radius:4px}.daytile.active .daydot{background:#49865c}
.stopwatch-card{border:1px solid #d3e1d2;background:#f4f8f1;padding:14px;border-radius:11px;margin:15px 0}
.watch-display{font:500 32px Georgia,serif;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:12px 0;color:#315f43}
.watch-buttons{display:flex;gap:7px;flex-wrap:wrap}.watch-buttons .button{flex:0 0 auto}
@media(max-width:520px){.bookdays-row{gap:5px;grid-template-columns:minmax(90px,1.7fr) minmax(44px,.6fr) minmax(49px,.7fr) minmax(60px,1fr);font-size:10px}.bookdays-row.titles{font-size:8px}.daytiles{gap:4px}.daytile{font-size:9px;padding:11px 0}.watch-display{font-size:30px}}

.speed-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0 18px}

.speed-summary-box.overall{background:#e5f0e5;border-color:#c8ddc9}
.speed-summary-label{font-size:10px;color:#54745e;font-weight:750}.speed-summary-rate{font:500 26px/1.1 Georgia,serif;color:#2f603f;font-variant-numeric:tabular-nums}
.speed-summary-rate small{font:600 10px system-ui,sans-serif;color:#718675}.speed-summary-notes{font-size:9px;color:#8a9b8d}
.speed-compare{display:flex;flex-direction:column;gap:14px;margin:16px 0 21px}.speed-compare-row .row{font-size:11px}.speed-compare-bar{height:9px;border-radius:20px;background:#edf1e9;overflow:hidden;margin-top:7px}.speed-compare-fill{height:100%;border-radius:20px}
.speed-swatch{display:inline-block;height:10px;width:10px;margin-right:7px;border-radius:3px;vertical-align:middle}

.speed-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:17px 0}.speed-detail-box{border:1px solid #dee8dc;background:#f6f8f3;padding:13px 9px;border-radius:9px}.speed-detail-value{font:500 25px Georgia,serif;color:#315e42;margin:8px 0 4px}.speed-detail-value small{font:600 10px system-ui;color:#819284}

@media(max-width:400px){.speed-table-row{grid-template-columns:minmax(91px,1.5fr) repeat(3,minmax(44px,.8fr));gap:4px;font-size:9px;padding:10px 5px}.speed-table-row.head{font-size:8px}.speed-summary-box{padding:11px 8px}.speed-detail-grid{gap:5px}.speed-detail-box{padding:10px 7px}.speed-detail-value{font-size:22px}}

.mock-rank-counts{display:flex;flex-wrap:wrap;gap:7px;margin-top:-6px;margin-bottom:13px;color:#476e51;font-size:10px;font-weight:750}

.daily-goal-card{background:linear-gradient(115deg,#f2f8ef,#fffefa);border-color:#d8e9d6}

@media(max-width:540px){.daily-goal-card .goal-num{font-size:25px}.daily-goal-card .three .stat{padding:9px 6px}.daily-goal-card .three .big{font-size:20px}}

.goal-compare-scroll.goal-compare-compact svg{width:100%;height:auto}
.goal-compare{background:linear-gradient(145deg,#fffefa,#f8faf6)}

<script>
(()=>{

const books=[

{id:'park',title:'Jurassic Park',author:'Michael Crichton',pages:448,status:'Finished',fav:true,rating:4.25,c:'#893e34',ink:'#ffefcd',glyph:'◇',height:154},
{id:'hail',title:'Project Hail Mary',author:'Andy Weir',pages:496,status:'Reading',fav:false,rating:null,c:'#2a5372',ink:'#f0e7d6',glyph:'✦',height:159},

{id:'hobbit',title:'The Hobbit',author:'J. R. R. Tolkien',pages:310,status:'Finished',fav:true,rating:4.5,c:'#497750',ink:'#f7e6b2',glyph:'♣',height:148},
{id:'hurt',title:"Can't Hurt Me",author:'David Goggins',pages:364,status:'Finished',fav:false,rating:4,c:'#555e60',ink:'#fbedd2',glyph:'◆',height:152}
];
const watch={running:false,startedAt:null,accumulatedMs:0};
function watchMs(){return watch.accumulatedMs+(watch.running?Math.max(0,Date.now()-watch.startedAt):0);}
function watchFmt(ms){const sec=Math.floor(ms/1000);return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(v=>String(v).padStart(2,'0')).join(':');}
function updateWatch(){const face=document.getElementById('mock-watch-face'),status=document.getElementById('mock-watch-status'),btn=document.getElementById('mock-watch-toggle');if(face)face.textContent=watchFmt(watchMs());if(status)status.textContent=watch.running?'Running':watch.accumulatedMs?'Paused':'Ready';if(btn)btn.textContent=watch.running?'Ⅱ Pause':watch.accumulatedMs?'▶ Resume':'▶ Start';}
const state={screen:new URLSearchParams(window.location.search).get('screen')||'bookshelf',habitsPeriod:'month',goalPeriod:'month',goalHistory:[{day:0,target:20},{day:314,target:30}],shelf:'Favorites',finish:'walnut',style:'covers',search:'',libShelf:'All',libGenre:'All',libView:'covers',libSort:'title',libSortDir:'asc',metric:'minutes',goal:20,dailyGoal:30,activityFilter:'all',sharingLevel:'summary',shelfMode:'all',selectedBook:'dune',mockLogScope:new URLSearchParams(window.location.search).get('scope')==='all'?'all':'reading',mockLogQuery:'',mockLogBook:'dune',trackingStart:'2026-11-16',manualMinutes:'52',mockEndingPage:'148',mockBookStatus:'reading',mockSelectedGenres:['Science Fiction','Adventure'],replayMockOffset:0,replayMockSlide:0,mockHistory:[{status:'finished',start:'',finish:'',year:'2022'},{status:'reading',start:'2026-11-05',finish:'',year:''}]};
function bookCover(b,cls=''){return `<div class="cover ${cls}" style="--cover:${b.c};--inkcover:${b.ink}"><span class="ctitle">${b.title}</span><span class="glyph">${b.glyph}</span><span class="cauthor">${b.author}</span>${b.fav?'<span class="ribbon">♥</span>':''}</div>`}

function shelfBook(b){let thick=Math.round(8+b.pages/58);return `<button class="sbook ${state.style==='spines'?'spine':''}" data-action="pickbook" data-id="${b.id}" title="${b.title}" style="--thick:${thick}px;--cover:${b.c};--inkcover:${b.ink};height:${b.height-12}px">${state.style==='spines'?`<span class="spine-label">${b.title}</span>`:bookCover(b)}</button>`}
function bookshelf(){const selected=books.filter(b=>(state.shelf==='All'||(state.shelf==='Favorites'?b.fav:b.status===state.shelf))&&(state.shelfMode==='all'||b.id===({reading:'dune',audiobook:'hail',read_listen:'park'}[state.shelfMode])));const nRows=Math.max(2,Math.ceil(selected.length/3));let html='';for(let i=0;i<nRows;i++){let row=selected.slice(i*3,i*3+3);html+=`<div class="shelf-row">${row.map(shelfBook).join('')}<span class="shelf-deco">${['🪴','🕯️','🖼️'][i%3]}</span></div>`}
return `<div class="eyebrow">COLLECT • CURATE • KEEP</div><h1 class="h1">The Bookshelf</h1><p class="lede">A place for every story. Change the finish, arrange the books, and give your favorite reads a home.</p><div class="row" style="flex-wrap:wrap"><div class="chips" style="margin:0">${['Favorites','All','Reading','TBR','Finished'].map(s=>`<button data-shelf="${s}" class="chip ${state.shelf===s?'active':''}">${s==='All'?'All books':s}</button>`).join('')}</div><button class="button small" data-action="reorder">⇄ Arrange</button></div><div class="row" style="margin:15px 0 2px"><div class="caption">${selected.length} books · ${state.shelfMode==='all'?'All reading modes':state.shelfMode}</div><div class="row" style="gap:6px"><select class="select" id="shelf-mode-filter"><option value="all">All modes</option><option value="reading" ${state.shelfMode==='reading'?'selected':''}>Reading</option><option value="audiobook" ${state.shelfMode==='audiobook'?'selected':''}>Audiobook</option><option value="read_listen" ${state.shelfMode==='read_listen'?'selected':''}>Read + Listen</option></select><select class="select" id="shelf-finish"><option value="walnut" ${state.finish==='walnut'?'selected':''}>Walnut</option><option value="oak" ${state.finish==='oak'?'selected':''}>Light Oak</option><option value="slate" ${state.finish==='slate'?'selected':''}>Slate</option></select><button data-action="style" class="button small">${state.style==='covers'?'◫ Covers':'▥ Spines'}</button></div></div><div class="shelf-hero" data-finish="${state.finish}"><div class="wood-top"></div>${html}</div><div class="favorite-summary"><div style="font-size:24px">♡</div><div><strong>Your stories, your space</strong><div class="text">Covers or spines, decorative objects, wood finishes, relative book sizes. Favorites are independent of reading status.</div></div></div><div class="footer-note">Visual concept • fictional cover artwork • illustrative book dimensions</div>`}
const mockBookGenres={dune:'Science Fiction',dove:'Western',park:'Thriller',hail:'Science Fiction',thrones:'Fantasy',carl:'Science Fiction',hobbit:'Fantasy',hurt:'Biography'};
function library(){
 const genreOf=b=>mockBookGenres[b.id]||'Uncategorized';
 const sorted=books.filter(b=>(state.libShelf==='All'||(state.libShelf==='Favorites'?b.fav:b.status===state.libShelf))
  &&(state.libGenre==='All'||genreOf(b)===state.libGenre)
  &&(b.title+' '+b.author).toLowerCase().includes(state.search.toLowerCase()));
 const order=state.libSortDir==='desc'?-1:1;
 sorted.sort((a,b)=>{
  const val=x=>state.libSort==='genre'?genreOf(x):state.libSort==='rating'?(x.rating??-1):state.libSort==='status'?x.status:x[state.libSort]||x.title;
  const av=val(a),bv=val(b);return (typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv)))*order;
 });
 const years={dune:2010,dove:1985,park:1990,hail:2021,thrones:1996,carl:2020,hobbit:1937,hurt:2018};
 const added={dune:'2025-08-21',dove:'2026-02-10',park:'2024-01-08',hail:'2026-10-22',thrones:'2023-04-09',carl:'2026-03-01',hobbit:'2024-05-18',hurt:'2025-06-14'};
 const finished={park:'2024-03-15',thrones:'2024-05-11',hobbit:'2025-02-14',hurt:'2025-07-10'};
 const titles=['title','author','genre','status','rating'];
 const name={title:'Title',author:'Author',genre:'Assigned genre',status:'Shelf',rating:'Rating'};
 const header=(key)=>`<th scope="col"><button data-libsort="${key}">${name[key]}${state.libSort===key?(state.libSortDir==='asc'?' ↑':' ↓'):''}</button></th>`;
 return `<div class="eyebrow">YOUR PRIVATE LIBRARY</div><h1 class="h1">Every book, one place.</h1><p class="lede">Find books by title, author, shelf, genre, and activity type. Switch between cover and table views without losing your filters.</p>
 <div class="row"><div class="caption">Showing ${sorted.length} of ${books.length} sample books</div><button class="button dark" data-screen="library_import">Import Goodreads ↗</button></div>
 <div class="searchbar"><span style="font-size:17px">⌕</span><input id="library-search" placeholder="Search title or author" value="${state.search}"/></div>
 <div class="chips">${['All','Reading','TBR','Finished','DNF','Favorites'].map(sh=>`<button class="chip ${state.libShelf===sh?'active':''}" data-libshelf="${sh}">${sh==='All'?'All books':sh}</button>`).join('')}</div>
 <div class="mock-library-controls"><label for="mock-lib-genre">Genre <select id="mock-lib-genre" class="select"><option value="All">All genres</option>${[...new Set(Object.values(mockBookGenres))].sort().map(g=>`<option value="${g}" ${state.libGenre===g?'selected':''}>${g}</option>`).join('')}</select></label>
 <div class="mock-view-toggle" role="group" aria-label="Library view"><button class="button ${state.libView==='covers'?'active':''}" data-libview="covers">▦ Covers</button><button class="button ${state.libView==='table'?'active':''}" data-libview="table">☷ Full table</button></div></div>
 ${state.libView==='covers'?`<div class="library-grid">${sorted.map(b=>`<button class="book-tile" data-action="pickbook" data-id="${b.id}"><span class="favtop">${b.fav?'♥':''}</span>${bookCover(b)}<div class="tile-title">${b.title}</div><div class="tile-author">${b.author}</div><div class="tile-meta"><span>${b.status}</span><span>${b.rating==null?'Unrated':b.rating.toFixed(2)+' ★'}</span></div><span class="mock-genre-label">${genreOf(b)}</span></button>`).join('')||'<div class="caption">No books match this filter.</div>'}</div>`:
 `<div class="mock-table-scroll" role="region" aria-label="Full library table; scroll horizontally" tabindex="0"><table class="mock-library-table"><thead><tr>${titles.map(header).join('')}<th>Pages</th><th>Edition year</th><th>Goodreads added</th><th>Finished</th></tr></thead><tbody>${sorted.map(b=>`<tr><td><button class="mock-link" data-action="pickbook" data-id="${b.id}">${b.title}</button></td><td>${b.author}</td><td><span class="mock-genre-label">${genreOf(b)}</span></td><td>${b.status}</td><td>${b.rating??'—'}</td><td>${b.pages}</td><td>${years[b.id]}</td><td>${added[b.id]}</td><td>${finished[b.id]||'—'}</td></tr>`).join('')||'<tr><td colspan="9">No books match this filter.</td></tr>'}</tbody></table></div>`}
 <div class="footer-note">Illustrative book data. The real app table also includes ISBN, publisher, binding, original publication year, TBR date and reading start date. Filters apply to both views.</div>`;
}
function mockImport(){return `<div class="eyebrow">MY LIBRARY · IMPORT WORKFLOW</div><h1 class="h1">Import & complete metadata</h1><p class="lede">When a Goodreads CSV is uploaded, all available Goodreads edition and date columns are saved first. Missing catalog information is then checked automatically.</p>

function logPage(kind='pages'){
 const audio=kind.startsWith('audio'),both=kind.startsWith('both'),chapters=kind.endsWith('chapters');
 const position=kind==='audio';
 const label=audio?'Audiobook Only':both?'Read + Listen':'Reading Only';

 const previewStart=({'dune':120,'hail':84,'dove':0,'park':448,'thrones':694,'carl':0,'hobbit':310,'hurt':364}[state.mockLogBook]??0);
 const previewEnd=Number(state.mockEndingPage);
 const pageN=chapters?49:position?42:Number.isInteger(previewEnd)&&previewEnd>previewStart?previewEnd-previewStart:0;
 const modeScreen={reading:'log_pages',audiobook:'log_audio_pages',read_listen:'log_both'};
 const pagesScreen=mode==='audiobook'?'log_audio_pages':mode==='read_listen'?'log_both':'log_pages';

 return `<div class="eyebrow">TRACK EVERY SESSION</div><h1 class="h1">Log your reading</h1>
 <p class="lede">Choose your activity type, then log time with page progress, exact mapped chapters, or optional audiobook positions.</p>

 <div class="segment"><button class="${selectedMethod==='pages'?'active':''}" data-screen="${pagesScreen}">Time + Ending Page</button><button class="${selectedMethod==='chapters'?'active':''}" data-screen="${chaptersScreen}">Time + Chapters</button>${mode!=='reading'?`<button class="${position?'active':''}" data-screen="${positionScreen}">Time + Audio Position</button>`:''}</div>
 <div style="margin-bottom:15px"><label class="field-label" for="mock-log-book">Book / selected print edition</label>
 ${state.mockLogScope==='all'?`<input class="input" type="search" id="mock-log-search" style="margin:7px 0 8px" placeholder="Search all books by title or author…" value="${state.mockLogQuery.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"/>`:''}
 ${(()=>{const opts=(state.mockLogScope==='all'?books:books.filter(b=>b.status==='Reading')).filter(b=>state.mockLogScope!=='all'||(b.title+' '+b.author).toLowerCase().includes(state.mockLogQuery.toLowerCase()));if(!opts.some(b=>b.id===state.mockLogBook))state.mockLogBook=opts[0]?.id||'';return `<select class="input" id="mock-log-book" ${opts.length?'':'disabled'}>${opts.length?opts.map(b=>`<option value="${b.id}" ${b.id===state.mockLogBook?'selected':''}>${b.title}${state.mockLogScope==='all'?' · '+b.status:''}</option>`).join(''):'<option>No matching books</option>'}</select>`;})()}
 <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:9px"><button class="button small" data-action="mock-log-other">${state.mockLogScope==='all'?'← Back to currently reading':'⌕ Choose another book'}</button><button class="button small" data-action="addbook">+ Add new book</button></div>
 <div class="helper">${state.mockLogScope==='all'?'All library shelves are available; historic reading passes should be selected before logging.':'Showing only your Currently Reading shelf (2 books in this fictional example).'}</div></div>
 <div class="fields"><div><label class="field-label">Session time (manual or stopwatch)</label><input class="input" type="number" min="1" id="mock-minutes" value="${state.manualMinutes}" aria-label="Session time in minutes"/></div>
 <div><label class="field-label" for="${selectedMethod==='pages'?'mock-ending-page':'mock-position'}">${position?'Audiobook position':chapters?'Exact chapters completed':pageTitle}</label>${selectedMethod==='pages'?`<input class="input" type="number" min="1" step="1" max="${books.find(b=>b.id===state.mockLogBook)?.pages||9999}" value="${state.mockEndingPage}" id="mock-ending-page"/><div class="helper">Starting from page ${previewStart} · Book details → Current page</div>`:`<div class="input" id="mock-position"><strong>${position?'01:25–02:17':'2–3'}</strong> <span class="caption">${position?'hh:mm':'chapters'}</span></div>`}</div></div>

 <div class="stopwatch-card"><div class="row"><div><div class="section-title">Optional stopwatch</div><div class="caption">Track elapsed time, or just enter minutes above.</div></div><span class="readonly" id="mock-watch-status">Ready</span></div>

function mockGoalSeries(period){
 const todayIdx=316,calendar=[];
 if(period==='week')for(let i=311;i<=317;i++)calendar.push({key:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i-311],first:i,last:i});
 if(period==='month')for(let day=1;day<=30;day++)calendar.push({key:String(day),first:303+day,last:303+day});
 if(period==='year'){
  let start=0;
  for(let month=0;month<12;month++){
   const last=new Date(Date.UTC(2026,month+1,0)).getUTCDate();
   calendar.push({key:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month],first:start,last:start+last-1});start+=last;
  }
 }
 return calendar.map(g=>{
   let actual=0,target=0,days=0;
   for(let d=g.first;d<=g.last&&d<=todayIdx;d++){
     if(d<0)continue; actual+=mockDailyMinutes(d);target+=targetAtDay(d);days++;
   }
   return {key:g.key,actual,target,days,future:!days};
 });
}

function mockModes(){const rows=[['reading','Reading Only',615],['audiobook','Audiobook Only',455],['read_listen','Read + Listen',280]];const total=rows.reduce((n,r)=>n+r[2],0);let cumulative=0;const wedges=rows.map(r=>{const first=cumulative; cumulative+=r[2]/total*100;return `${habitColors[r[0]]} ${first}% ${cumulative}%`;}).join(',');return `<div class="card"><div class="v18-feature-badge">READING MODES · PIE CHART</div><div class="section-title">Reading vs listening distribution</div><div class="caption">Share of total minutes by activity type</div><div class="v19-pie-layout"><div class="v19-pie" style="background:conic-gradient(${wedges})" role="img" aria-label="Reading only 45.6 percent, audiobook 33.7 percent, read plus listen 20.7 percent"></div><div class="v19-pie-legend">${rows.map((r,i)=>`<div class="v19-pie-item"><span><i style="background:${habitColors[r[0]]}"></i><strong>${r[1]}</strong></span><strong>${(100*r[2]/total).toFixed(1)}%</strong><div class="caption">${Math.floor(r[2]/60)}h ${String(r[2]%60).padStart(2,'0')}m · ${[18,13,8][i]} sessions</div></div>`).join('')}</div></div><div class="v18-card-highlight">Read + Listen appears in its own slice; time is counted <strong>once</strong>, never doubled.</div></div>`;}
function mockGoalSuccess(){return `<div class="card"><div class="v18-feature-badge">DAILY GOAL CONSISTENCY</div><div class="section-title">How often did you reach your goal?</div><p class="caption">Uses each date's historical target, even after the daily goal changes</p><div class="stats" style="margin-top:16px">${stat('72%','Days met goal')}${stat('13 / 18','Goal days')}${stat('5 days','Goal streak')}${stat('17 days','Best goal streak')}</div>${goalReferencePreview(state.habitsPeriod)}<p class="v18-page-note">All activity modes count. Daily goal success is never filtered to one book or one reading type, so the historical reference stays consistent.</p></div>`;}
function mockTimeHeatmap(){const period=habitSample(),names=['Morning','Midday','Afternoon','Evening','Night'];let html='<div class="v18-heat-header"><span></span>'+names.map(x=>`<span>${x}</span>`).join('')+'</div>';
 for(let d=0;d<7;d++)html+=`<div class="v18-heat-row"><strong>${habitWeekdays[d]}</strong>${names.map((n,i)=>{let level=((d*13+i*7+10)%16)+1;const alpha=.12+level/16*.78;const mins=5+level*6;return `<span class="v18-heat-cell" title="${habitWeekdays[d]} ${n}: ${mins}m" style="background:rgba(41,111,67,${alpha.toFixed(2)})"></span>`}).join('')}</div>`;
 return `<div class="card"><div class="v18-feature-badge">ROUTINE HEATMAP</div><div class="section-title">Day of week × time of day</div><p class="caption">Total reading and listening minutes · darker cells mean more activity</p><div style="margin-top:17px">${html}</div><div class="row caption" style="margin-top:12px"><span>Less activity</span><span>More activity</span></div><div class="helper" style="margin-top:15px">Sessions missing start times are listed separately as Unknown, not silently allocated to a time band. Sessions spanning midnight split their minutes between the correct days.</div></div>`;}

watch.running=false;watch.accumulatedMs=0;watch.startedAt=null;}else if(a==='watch-use'){if(watch.running){watch.accumulatedMs=watchMs();watch.running=false;watch.startedAt=null;}if(watch.accumulatedMs){state.manualMinutes=String(Math.ceil(watch.accumulatedMs/60000));}}render();});
